<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#03010a">
  <title>PPT设计者｜蒋淑婷</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0}
    body{overflow:hidden;background:#03010a;color:#fff;font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}
    .page{position:relative;width:100vw;height:100svh;min-height:480px;overflow:hidden;isolation:isolate;background:#03010a}
    #fluid{position:absolute;inset:0;z-index:0;width:100%;height:100%;display:block}
    .page::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 24%,rgba(3,1,10,.15) 66%,rgba(3,1,10,.7) 100%)}
    .title{position:absolute;left:50%;top:50%;z-index:3;margin:0;transform:translate(-50%,-50%);font-size:clamp(3rem,9vw,8rem);font-weight:900;line-height:1;letter-spacing:-.04em;white-space:nowrap;text-align:center;color:#fff;text-shadow:0 0 12px rgba(255,255,255,.25),0 0 44px rgba(255,255,255,.12),0 16px 42px rgba(0,0,0,.62);opacity:0;filter:blur(14px);animation:title-in 1.7s .35s cubic-bezier(.16,1,.3,1) forwards,soft-jitter 5.8s 2.4s steps(1,end) infinite;pointer-events:none}
    .back{position:fixed;left:max(18px,env(safe-area-inset-left));top:max(18px,env(safe-area-inset-top));z-index:5;display:inline-flex;align-items:center;min-height:44px;padding:10px 16px;color:rgba(255,255,255,.74);text-decoration:none;font-size:.72rem;font-weight:700;letter-spacing:.14em;border:1px solid rgba(255,255,255,.2);background:rgba(3,1,10,.4);border-radius:999px;backdrop-filter:blur(12px);transition:.25s ease}
    .back:hover,.back:focus-visible{color:#fff;border-color:rgba(255,255,255,.58);background:rgba(20,18,26,.7);transform:translateX(-3px);outline:none}
    .fallback{position:absolute;inset:-12%;opacity:.7;background:repeating-radial-gradient(ellipse at 50% 80%,transparent 0 6%,rgba(255,255,255,.68) 6.2% 6.7%,transparent 7% 12%);filter:blur(1px);animation:drift 8s ease-in-out infinite alternate}
    @keyframes title-in{to{opacity:1;filter:blur(0)}}@keyframes drift{to{transform:translateY(-4%) scale(1.05)}}
    @keyframes soft-jitter{0%,91%,100%{margin-left:0;margin-top:0}92%{margin-left:-1px;margin-top:1px}93%{margin-left:1px;margin-top:-1px}94%{margin-left:0;margin-top:0}96%{margin-left:1px;margin-top:0}97%{margin-left:-1px;margin-top:0}98%{margin-left:0;margin-top:0}}
    @media(max-width:620px){.title{font-size:clamp(2.7rem,14vw,4.6rem)}}
    @media(prefers-reduced-motion:reduce){.title{animation:none;opacity:1;filter:none}.fallback{animation:none}}
  </style>
</head>
<body>
  <main class="page"><canvas id="fluid" aria-hidden="true"></canvas><a class="back" href="index.html#skills" aria-label="返回技能矩阵">← 返回</a><h1 class="title">PPT设计者</h1></main>
  <script>
  (()=>{const canvas=document.getElementById('fluid'),gl=canvas.getContext('webgl',{alpha:true,antialias:false,powerPreference:'high-performance'});
    if(!gl){const f=document.createElement('div');f.className='fallback';canvas.replaceWith(f);return}
    const vertex=`attribute vec2 position;varying vec2 vUv;void main(){vUv=position*.5+.5;gl_Position=vec4(position,0.,1.);}`;
    const fragment=`precision highp float;
uniform vec3 iResolution;uniform vec2 iMouse;uniform float iTime;uniform vec2 uFlow;uniform float uSpeed,uScale,uTurbulence,uFluidity,uRimWidth,uSharpness,uShimmer,uGlow,uOpacity,uMouseStrength,uMouseRadius;varying vec2 vUv;
#define PI 3.14159265
float hash(vec3 p3){p3=fract(p3*.1031);p3+=dot(p3,p3.zyx+33.33);return fract((p3.x+p3.y)*p3.z);}
float smin(float a,float b,float k){float r=exp2(-a/k)+exp2(-b/k);return-k*log2(r);}
float sinlerp(float a,float b,float w){return mix(a,b,(sin(w*PI-PI/2.)+1.)/2.);}
float vn(vec2 p,float s,float seed){vec2 cellp=floor(p/s),relp=mod(p,s);float g1=hash(vec3(cellp,seed)),g2=hash(vec3(cellp.x+1.,cellp.y,seed)),g3=hash(vec3(cellp.x+1.,cellp.y+1.,seed)),g4=hash(vec3(cellp.x,cellp.y+1.,seed));float bx=sinlerp(g1,g2,relp.x/s),tx=sinlerp(g4,g3,relp.x/s);return sinlerp(bx,tx,relp.y/s);}
float dbn(vec2 p,float s,float seed){float o=s/2.;float n0=vn(p,s,seed),n1=vn(p+vec2(o),s,seed+.1),n2=vn(p+vec2(-o,o),s,seed+.2),n3=vn(p+vec2(o,-o),s,seed+.3),n4=vn(p-vec2(o),s,seed+.4);return(2.*n0+1.5*n1+1.25*n2+1.125*n3+n4)/7.;}
void main(){vec2 fragCoord=vUv*iResolution.xy;float ref=700./max(uScale,.05);vec2 p=fragCoord/iResolution.y*ref;float spd=200.*uSpeed,t=iTime;vec2 dir=uFlow,perp=vec2(-dir.y,dir.x);float distort1=vn(p+perp*(t*spd),60.,10.)*50.*uTurbulence;float distort2=vn(p-perp*(t*spd),120.,15.)*100.*uTurbulence;float peaks=dbn(p+distort1+dir*(t*spd*.5),40.,1.);float peaks2=dbn(p+distort2-dir*(t*spd*.5),40.,0.);float mapeaks=smin(peaks,peaks2,max(uFluidity,.001));vec2 mp=iMouse/iResolution.y*ref;float md=length(p-mp)/ref,rr=max(uMouseRadius,.02);float mGlow=exp(-md*md/(rr*rr))*uMouseStrength;float band=(uRimWidth-abs((mapeaks-.4)*2.))*5.;float ltn=clamp(band-vn(p+dir*(t*spd*.5),60.,12.)*uShimmer,0.,1.);ltn=pow(ltn,uSharpness)*uGlow;ltn*=clamp(1.-mGlow,0.,1.);vec3 outc=vec3(1.)*ltn;float a=clamp(max(outc.r,max(outc.g,outc.b)),0.,1.);gl_FragColor=vec4(outc,a*uOpacity);}`;
    const compile=(type,source)=>{const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s};let program;
    try{program=gl.createProgram();gl.attachShader(program,compile(gl.VERTEX_SHADER,vertex));gl.attachShader(program,compile(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program))}catch(error){console.warn(error);const f=document.createElement('div');f.className='fallback';canvas.replaceWith(f);return}
    gl.useProgram(program);const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(program,'position');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    const u=n=>gl.getUniformLocation(program,n),q={res:u('iResolution'),mouse:u('iMouse'),time:u('iTime'),flow:u('uFlow'),speed:u('uSpeed'),scale:u('uScale'),turb:u('uTurbulence'),fluid:u('uFluidity'),rim:u('uRimWidth'),sharp:u('uSharpness'),shimmer:u('uShimmer'),glow:u('uGlow'),opacity:u('uOpacity'),strength:u('uMouseStrength'),radius:u('uMouseRadius')};
    gl.uniform2f(q.flow,0,-1);gl.uniform1f(q.speed,.5);gl.uniform1f(q.scale,1);gl.uniform1f(q.turb,1);gl.uniform1f(q.fluid,.1);gl.uniform1f(q.rim,.2);gl.uniform1f(q.sharp,3);gl.uniform1f(q.shimmer,1);gl.uniform1f(q.glow,2);gl.uniform1f(q.opacity,1);gl.uniform1f(q.strength,1);gl.uniform1f(q.radius,.3);
    let w=0,h=0,dpr=1,targetX=.5,targetY=.5,mouseX=.5,mouseY=.5,last=0,elapsed=0,frame=0;
    const resize=()=>{w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,innerWidth<700?1.2:1.55);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';gl.viewport(0,0,canvas.width,canvas.height);gl.uniform3f(q.res,canvas.width,canvas.height,1)};
    const move=e=>{targetX=e.clientX/Math.max(w,1);targetY=1-e.clientY/Math.max(h,1)};
    const draw=t=>{const dt=last?Math.min(t-last,100):0;last=t;elapsed+=dt*.001;const factor=1-Math.exp(-Math.max(dt,.1)/150);mouseX+=(targetX-mouseX)*factor;mouseY+=(targetY-mouseY)*factor;gl.uniform2f(q.mouse,mouseX*canvas.width,mouseY*canvas.height);gl.uniform1f(q.time,elapsed);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.drawArrays(gl.TRIANGLES,0,3);frame=requestAnimationFrame(draw)};
    const start=()=>{if(!frame){last=0;frame=requestAnimationFrame(draw)}},stop=()=>{if(frame){cancelAnimationFrame(frame);frame=0}};
    resize();addEventListener('resize',resize,{passive:true});canvas.addEventListener('pointermove',move,{passive:true});canvas.addEventListener('pointerleave',()=>{targetX=.5;targetY=.5},{passive:true});document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){gl.uniform2f(q.mouse,canvas.width*.5,canvas.height*.5);gl.uniform1f(q.time,.8);gl.clear(gl.COLOR_BUFFER_BIT);gl.drawArrays(gl.TRIANGLES,0,3)}else start();
  })();
  </script>
</body>
</html>
