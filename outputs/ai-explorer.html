<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07070a">
  <title>AI 探索者｜蒋淑婷</title>
  <style>
    :root{color-scheme:dark;--ink:#f5f3f7}*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0}
    body{overflow:hidden;color:var(--ink);background:#07070a;font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}
    .page{position:relative;width:100vw;height:100svh;min-height:480px;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 50% 48%,#19121d 0,#09090c 48%,#030305 100%)}
    #rings{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block}
    .page::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 30%,rgba(0,0,0,.18) 68%,rgba(0,0,0,.68) 100%)}
    .title-wrap{position:absolute;left:50%;top:50%;z-index:3;width:min(92vw,1100px);text-align:center;pointer-events:none;transform:translate(-50%,-50%)}
    .eyebrow{margin:0 0 18px;color:rgba(243,238,247,.52);font-size:clamp(.58rem,.9vw,.76rem);font-weight:700;letter-spacing:.34em;opacity:0;animation:soft-in 1.1s .35s ease forwards}
    h1{margin:0;font-size:clamp(4rem,12vw,10rem);font-weight:800;line-height:.96;letter-spacing:.08em;white-space:nowrap;opacity:0;filter:blur(18px);transform:scale(.97);text-shadow:0 2px 0 rgba(255,255,255,.18),0 18px 60px rgba(0,0,0,.58);animation:title-in 2.2s .55s cubic-bezier(.16,1,.3,1) forwards}
    .tagline{margin:22px 0 0;color:rgba(241,237,244,.68);font-size:clamp(.72rem,1.05vw,.92rem);font-weight:500;letter-spacing:.2em;opacity:0;animation:soft-in 1.2s 1.65s ease forwards}
    .back{position:fixed;left:max(18px,env(safe-area-inset-left));top:max(18px,env(safe-area-inset-top));z-index:5;display:inline-flex;align-items:center;min-height:44px;padding:10px 16px;color:rgba(247,243,250,.76);text-decoration:none;font-size:.72rem;font-weight:700;letter-spacing:.14em;border:1px solid rgba(243,224,248,.2);background:rgba(8,7,10,.38);border-radius:999px;backdrop-filter:blur(12px);transition:.25s ease}
    .back:hover,.back:focus-visible{color:#fff;border-color:rgba(252,66,255,.6);background:rgba(29,15,32,.7);transform:translateX(-3px);outline:none}
    .fallback{position:absolute;inset:10%;border-radius:50%;opacity:.72;background:repeating-radial-gradient(circle,transparent 0 7%,rgba(252,66,255,.34) 7.3% 7.7%,transparent 8% 15%,rgba(66,252,255,.3) 15.3% 15.8%,transparent 16% 23%);filter:blur(2px);animation:fallback-pulse 4s ease-in-out infinite}
    @keyframes title-in{to{opacity:1;filter:blur(0);transform:scale(1)}}@keyframes soft-in{to{opacity:1}}@keyframes fallback-pulse{50%{transform:scale(1.08);opacity:.95}}
    @media(max-width:620px){h1{font-size:clamp(3.2rem,17vw,5.3rem);letter-spacing:.03em}.eyebrow{letter-spacing:.2em}.tagline{letter-spacing:.12em}}
    @media(prefers-reduced-motion:reduce){h1,.eyebrow,.tagline{animation:none;opacity:1;filter:none;transform:none}.fallback{animation:none}}
  </style>
</head>
<body>
  <main class="page"><canvas id="rings" aria-hidden="true"></canvas><a class="back" href="index.html#skills" aria-label="返回技能矩阵">← 返回</a>
    <div class="title-wrap"><p class="eyebrow">ARTIFICIAL INTELLIGENCE · EXPLORATION</p><h1>AI 探索者</h1><p class="tagline">——用工具找出可能</p></div>
  </main>
  <script>
  (()=>{const canvas=document.getElementById('rings'),gl=canvas.getContext('webgl2',{alpha:true,antialias:false,powerPreference:'high-performance'});
    if(!gl){const f=document.createElement('div');f.className='fallback';canvas.replaceWith(f);return}
    const vertex=`#version 300 es
precision highp float;
void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.0-1.0,0.0,1.0);}`;
    const fragment=`#version 300 es
precision highp float;
uniform float uTime,uAttenuation,uLineThickness,uBaseRadius,uRadiusStep,uScaleRate,uOpacity,uNoiseAmount,uRotation,uRingGap,uFadeIn,uFadeOut,uHoverAmount,uHoverScale;
uniform vec2 uResolution;uniform vec3 uColor,uColorTwo;out vec4 outColor;
const float HP=1.5707963;const float CYCLE=3.45;
float fadeRing(float t){return t<uFadeIn?smoothstep(0.0,uFadeIn,t):1.0-smoothstep(uFadeOut,CYCLE-0.2,t);}
float ring(vec2 p,float ri,float cut,float t0,float px){float t=mod(uTime+t0,CYCLE);float r=ri+t/CYCLE*uScaleRate;float d=abs(length(p)-r);float a=atan(abs(p.y),abs(p.x))/HP;float th=max(1.0-a,0.5)*px*uLineThickness;float h=(1.0-smoothstep(th,th*1.5,d))+1.0;d+=pow(cut*a,3.0)*r;return h*exp(-uAttenuation*d)*fadeRing(t);}
void main(){float px=1.0/min(uResolution.x,uResolution.y);vec2 p=(gl_FragCoord.xy-.5*uResolution.xy)*px;float cr=cos(uRotation),sr=sin(uRotation);p=mat2(cr,-sr,sr,cr)*p;p/=mix(1.0,uHoverScale,uHoverAmount);vec3 c=vec3(0.0);for(int i=0;i<6;i++){float fi=float(i);vec3 rc=mix(uColor,uColorTwo,fi/5.0);float amount=ring(p,uBaseRadius+fi*uRadiusStep,pow(uRingGap,fi),i==0?0.0:2.95*fi,px);c=mix(c,rc,vec3(amount));}float n=fract(sin(dot(gl_FragCoord.xy+uTime*100.0,vec2(12.9898,78.233)))*43758.5453);c+=(n-.5)*uNoiseAmount;float intensity=max(c.r,max(c.g,c.b));vec3 emissive=intensity>.0001?clamp(c/intensity,0.0,1.0):vec3(0.0);outColor=vec4(emissive,clamp(intensity*uOpacity,0.0,1.0));}`;
    const shader=(type,source)=>{const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s};let program;
    try{program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vertex));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program))}catch(error){console.warn(error);const f=document.createElement('div');f.className='fallback';canvas.replaceWith(f);return}
    gl.useProgram(program);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);const u=name=>gl.getUniformLocation(program,name);
    const q={time:u('uTime'),resolution:u('uResolution'),attenuation:u('uAttenuation'),line:u('uLineThickness'),base:u('uBaseRadius'),step:u('uRadiusStep'),rate:u('uScaleRate'),opacity:u('uOpacity'),noise:u('uNoiseAmount'),rotation:u('uRotation'),gap:u('uRingGap'),fadeIn:u('uFadeIn'),fadeOut:u('uFadeOut'),hover:u('uHoverAmount'),hoverScale:u('uHoverScale'),color:u('uColor'),colorTwo:u('uColorTwo')};
    gl.uniform1f(q.attenuation,10);gl.uniform1f(q.line,2);gl.uniform1f(q.base,.35);gl.uniform1f(q.step,.1);gl.uniform1f(q.rate,.1);gl.uniform1f(q.opacity,1);gl.uniform1f(q.noise,.1);gl.uniform1f(q.rotation,0);gl.uniform1f(q.gap,1.5);gl.uniform1f(q.fadeIn,.7);gl.uniform1f(q.fadeOut,.5);gl.uniform1f(q.hoverScale,1.2);gl.uniform3f(q.color,.988,.259,1);gl.uniform3f(q.colorTwo,.259,.988,1);
    let dpr=1,w=0,h=0,hover=0,inside=false,last=0,elapsed=0,frame=0;
    const resize=()=>{dpr=Math.min(devicePixelRatio||1,innerWidth<700?1.35:1.75);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';gl.viewport(0,0,canvas.width,canvas.height);gl.uniform2f(q.resolution,canvas.width,canvas.height)};
    const draw=t=>{const dt=last?Math.min(t-last,100):0;last=t;elapsed+=dt*.001;hover+=(Number(inside)-hover)*.07;gl.uniform1f(q.time,elapsed);gl.uniform1f(q.hover,hover);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.drawArrays(gl.TRIANGLES,0,3);frame=requestAnimationFrame(draw)};
    const start=()=>{if(!frame){last=0;frame=requestAnimationFrame(draw)}},stop=()=>{if(frame){cancelAnimationFrame(frame);frame=0}};
    resize();addEventListener('resize',resize,{passive:true});canvas.addEventListener('pointerenter',()=>inside=true,{passive:true});canvas.addEventListener('pointerleave',()=>inside=false,{passive:true});document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){gl.uniform1f(q.time,.8);gl.uniform1f(q.hover,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.drawArrays(gl.TRIANGLES,0,3)}else start();
  })();
  </script>
</body>
</html>
